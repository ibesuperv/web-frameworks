<!DOCTYPE html>
<html>
<head>
    <title>AngularJS + NodeJS Integration</title>
    <!-- AngularJS Library CDN -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <style>
        body { font-family: sans-serif; margin: 40px; background-color: #f8f9fa; }
        .box { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        input[type="text"] { width: 70%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; font-size: 14px; background-color: #27ae60; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .item-list { margin-top: 20px; padding: 0; list-style: none; }
        .item-list li { padding: 10px; background: #f1f2f6; border-bottom: 1px solid #ddd; border-radius: 4px; margin-bottom: 5px; }
        .status-msg { margin-top: 15px; font-size: 13px; color: #7f8c8d; }
    </style>
</head>
<body ng-app="integrationApp">

    <div class="box" ng-controller="MainController">
        <h2>AngularJS + NodeJS Integration</h2>
        <p>This frontend connects to the running Node server API (<code>http://localhost:3000</code>).</p>
        <hr>

        <form ng-submit="addItem()">
            <input type="text" ng-model="newItem" placeholder="Enter item name..." required>
            <button type="submit">Add Item</button>
        </form>

        <ul class="item-list">
            <li ng-repeat="x in items">{{ x }}</li>
        </ul>

        <div class="status-msg">{{ statusMessage }}</div>
    </div>

    <script>
        var app = angular.module("integrationApp", []);

        app.controller("MainController", function($scope, $http) {
            const API_URL = "http://localhost:3000/api/items";
            $scope.items = [];
            $scope.newItem = "";
            $scope.statusMessage = "Loading items from Node server...";

            // 1. GET Operation: Fetch items from Node backend
            $scope.fetchItems = function() {
                $http.get(API_URL)
                    .then(function(response) {
                        $scope.items = response.data;
                        $scope.statusMessage = "Loaded items successfully.";
                    }, function(error) {
                        $scope.statusMessage = "Error connecting to Node backend. Is server.js running?";
                        console.error(error);
                    });
            };

            // 2. POST Operation: Send new item to Node backend
            $scope.addItem = function() {
                if ($scope.newItem.trim() !== "") {
                    $scope.statusMessage = "Adding item...";
                    $http.post(API_URL, { item: $scope.newItem })
                        .then(function(response) {
                            $scope.items = response.data.items; // Backend returns updated array
                            $scope.newItem = ""; // Clear input
                            $scope.statusMessage = "Item added successfully.";
                        }, function(error) {
                            $scope.statusMessage = "Failed to add item.";
                            console.error(error);
                        });
                }
            };

            // Initial fetch on controller load
            $scope.fetchItems();
        });
    </script>
</body>
</html>
