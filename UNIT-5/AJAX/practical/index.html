<!DOCTYPE html>
<html>
<head>
    <title>AJAX Practical: XMLHttpRequest & DOM Modification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f6fa;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        .status {
            margin-top: 15px;
            color: #7f8c8d;
            font-style: italic;
        }
        .user-card {
            margin-top: 20px;
            padding: 15px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            background-color: #fcfcfc;
        }
        .user-card h3 {
            margin: 0 0 10px 0;
            color: #2c3e50;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AJAX API Fetch Practical</h2>
        <p>Fetches data asynchronously in the background using the native <code>XMLHttpRequest</code> object.</p>
        <button class="btn" onclick="loadUser()">Load User Details</button>
        
        <div id="statusMessage" class="status">Click button to send request.</div>
        
        <div id="resultArea" style="display: none;">
            <div class="user-card">
                <h3 id="userName">User Name</h3>
                <p><strong>Email:</strong> <span id="userEmail"></span></p>
                <p><strong>City:</strong> <span id="userCity"></span></p>
                <p><strong>Company:</strong> <span id="userCompany"></span></p>
            </div>
        </div>
    </div>

    <script>
        // 1. Cross-Browser Compatible Function to Create XMLHttpRequest Object
        function createXHR() {
            if (window.XMLHttpRequest) {
                // Code for modern browsers
                return new XMLHttpRequest();
            } else if (window.ActiveXObject) {
                // Code for legacy IE5/IE6
                try {
                    return new ActiveXObject("Msxml2.XMLHTTP");
                } catch (e) {
                    try {
                        return new ActiveXObject("Microsoft.XMLHTTP");
                    } catch (e) {
                        alert("AJAX is not supported by your browser.");
                        return null;
                    }
                }
            }
            return null;
        }

        // 2. Fetch data from free Placeholder REST API
        function loadUser() {
            var xhr = createXHR();
            if (!xhr) return;

            var status = document.getElementById("statusMessage");
            var result = document.getElementById("resultArea");

            // Open the request (GET, URL, Async = true)
            xhr.open("GET", "https://jsonplaceholder.typicode.com/users/1", true);

            // Triggered every time xhr.readyState changes
            xhr.onreadystatechange = function() {
                status.innerText = "Current ReadyState: " + xhr.readyState + "...";

                // Checks: readyState 4 (Complete) and status 200 (OK)
                if (xhr.readyState === 4) {
                    if (xhr.status === 200) {
                        status.innerText = "Request complete successfully!";
                        
                        // Parse JSON response string
                        var user = JSON.parse(xhr.responseText);

                        // Modify HTML DOM dynamically
                        document.getElementById("userName").innerText = user.name;
                        document.getElementById("userEmail").innerText = user.email;
                        document.getElementById("userCity").innerText = user.address.city;
                        document.getElementById("userCompany").innerText = user.company.name;

                        // Show result card
                        result.style.display = "block";
                    } else {
                        status.innerText = "Error loading user data (Status Code: " + xhr.status + ")";
                    }
                }
            };

            // Send request to server
            xhr.send();
        }
    </script>
</body>
</html>
